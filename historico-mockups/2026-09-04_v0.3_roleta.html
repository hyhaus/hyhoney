<title>HyHoney</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,600;9..144,800,100&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#FBF6EC; --surface:#FFFDF7; --surface2:#F3EBDA; --line:#E6DAC2;
  --ink:#2B2118; --ink2:#6E5E4B; --muted:#9A8A73;
  --accent:#E8A33D; --accent-ink:#2B2118; --accent-soft:#FBE7C2;
  --rose:#E36A7C; --rose-soft:#FBDDE2; --sage:#6F9C6B; --sage-soft:#DDEBD9; --sky:#5B8FB9; --sky-soft:#DCE9F3;
  --gold:#C9962B; --shadow:0 8px 24px rgba(80,55,20,.10);
  --display:'Fraunces',Georgia,serif; --body:'Nunito',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1913; --surface:#26211A; --surface2:#2F2921; --line:#3D352A;
    --ink:#F2E9DA; --ink2:#C9BBA4; --muted:#8F8270; --accent:#F0B24F; --accent-soft:#3D3320;
    --rose:#F08596; --rose-soft:#3F2A2E; --sage:#8DBB88; --sage-soft:#26332A; --sky:#7FB0D8; --sky-soft:#22303A;
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1913; --surface:#26211A; --surface2:#2F2921; --line:#3D352A;
  --ink:#F2E9DA; --ink2:#C9BBA4; --muted:#8F8270; --accent:#F0B24F; --accent-soft:#3D3320;
  --rose:#F08596; --rose-soft:#3F2A2E; --sage:#8DBB88; --sage-soft:#26332A; --sky:#7FB0D8; --sky-soft:#22303A;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
/* Temas alternativos (peles) aplicados no #app */
#app[data-skin="cartorio"]{ --bg:#1B1A1F; --surface:#24232A; --surface2:#2E2C35; --line:#3E3B46; --ink:#EFE6D2; --ink2:#C3B79C; --muted:#857B69; --accent:#D4AF5A; --accent-soft:#3A3120; --rose:#C97A8A; --rose-soft:#3A2830; --sage:#8AA88A; --sage-soft:#26322A; --sky:#8AA6C4; --sky-soft:#242E3A; --display:'Fraunces',Georgia,serif; --r:6px; --shadow:0 10px 30px rgba(0,0,0,.45)}
#app[data-skin="polaroid"]{ --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F4F4F2; --line:#E2E2DE; --ink:#1E1E1E; --ink2:#5A5A5A; --muted:#9A9A96; --accent:#E36A7C; --accent-soft:#FDE3E7; --rose:#E36A7C; --rose-soft:#FDE3E7; --sage:#6F9C6B; --sage-soft:#E3EEE1; --sky:#5B8FB9; --sky-soft:#E0EBF4; --r:4px; --shadow:0 6px 18px rgba(0,0,0,.14)}
#app[data-skin="arcade"]{ --bg:#0F0B1A; --surface:#181229; --surface2:#221A38; --line:#332A4F; --ink:#F4EEFF; --ink2:#BFB3DE; --muted:#7E7399; --accent:#FF3FA4; --accent-soft:#3D1531; --rose:#FF3FA4; --rose-soft:#3D1531; --sage:#3FE0C8; --sage-soft:#123531; --sky:#3FD2FF; --sky-soft:#12303A; --r:2px; --shadow:0 0 24px rgba(255,63,164,.25)}
#app[data-skin="passaporte"]{ --bg:#EEF2F0; --surface:#FFFFFF; --surface2:#E3EAE6; --line:#CCD8D1; --ink:#14263A; --ink2:#3F5468; --muted:#7D8E9C; --accent:#1F6F5B; --accent-soft:#D6EBE3; --rose:#B8433F; --rose-soft:#F3D9D7; --sage:#1F6F5B; --sage-soft:#D6EBE3; --sky:#214E7C; --sky-soft:#D8E4F1; --r:10px; --shadow:0 8px 24px rgba(20,38,58,.12)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
#app{display:grid;grid-template-columns:264px 1fr 320px;height:100vh;background:var(--bg);color:var(--ink);transition:background .3s}
@media (max-width:1000px){#app{grid-template-columns:240px 1fr}#detail{display:none}}
/* ---------- MOBILE (estilo TickTick: gaveta de listas + barra inferior de ícones + folha de detalhe) ---------- */
.mob-top{display:none}
.tabbar{display:none}
.scrim{display:none}
@media (max-width:680px){
  #app{grid-template-columns:1fr;height:100dvh;position:relative}
  #sidebar{position:fixed;inset:0 18% 0 0;z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow);max-width:340px}
  #app.drawer #sidebar{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}
  #app.drawer .scrim{opacity:1;pointer-events:auto}
  #sidebar .shortcuts{display:none}
  #main{padding:0 14px 92px}
  .mob-top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 8px;margin-bottom:6px}
  .mob-top .ham{width:38px;height:38px;border-radius:10px;font-size:20px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
  .mob-top .couple{margin-left:auto;display:flex}.mob-top .couple .avatar{margin-left:-6px;border:2px solid var(--bg)}
  .topbar{flex-wrap:wrap;margin-bottom:12px}.topbar h2{font-size:22px}.topbar .tools{width:100%;margin-left:0;overflow-x:auto}
  .hero,.grid[style*="grid-template-columns"]{grid-template-columns:1fr !important}
  .big{font-size:48px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px;font-size:10px;font-weight:800;color:var(--muted);position:relative}
  .tabbar button .i{font-size:22px;line-height:1}
  .tabbar button.active{color:var(--ink)}
  .tabbar button.active::after{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:2px;background:var(--accent)}
  .tabbar button .badge{position:absolute;top:0;right:calc(50% - 20px);min-width:14px;height:14px;border-radius:7px;background:var(--rose);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 3px}
  #app.editing .tabbar button{animation:wiggle .35s ease-in-out infinite alternate}
  #detail{display:block;position:fixed;left:0;right:0;bottom:0;top:auto;max-height:72vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:var(--shadow);z-index:45;transform:translateY(105%);transition:transform .25s}
  #app.sheet #detail{transform:none}
  #detail::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
  .pop{position:fixed;left:8px !important;right:8px;top:auto !important;bottom:70px;max-height:70vh;overflow:auto}
  .contract{padding:20px 16px}
  .tag-ex{display:none}
  /* v0.2 — passe de design (Fitts, Hick, fluência): alvos ≥ 44px, escala fixa, um botão primário */
  body{font-size:15px}
  .row{min-height:48px;padding:10px 8px;gap:12px}
  .check{width:22px;height:22px;font-size:12px}
  .topbar h2{font-size:28px;letter-spacing:-.01em}
  .topbar .tools .tb{min-height:44px;padding:0 16px}
  .topbar .tools .tb:not(.primary):not(.ai){display:none}
  .tabbar button{min-height:52px;font-size:11px}
  .tabbar button .i{font-size:24px}
  .card{padding:16px 14px}
  .coupon .use,.tb.primary{min-height:44px}
  .shortcuts .sc,.item{min-height:44px}
  .cd-units b{font-size:40px}
  .label{font-size:11px}
}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.row.done .check{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){.row.done .check{animation:none}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--surface2);color:var(--ink2)}
.chip.rose{background:var(--rose-soft);color:var(--rose)} .chip.sage{background:var(--sage-soft);color:var(--sage)} .chip.sky{background:var(--sky-soft);color:var(--sky)} .chip.gold{background:var(--accent-soft);color:var(--ink)}
.label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.av-a{background:var(--accent);color:var(--accent-ink)} .av-b{background:var(--rose)}

/* ---------- SIDEBAR ---------- */
#sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--muted)}
.couple{margin-left:auto;display:flex}
.couple .avatar{margin-left:-6px;border:2px solid var(--surface)}
.shortcuts{display:flex;align-items:center;gap:4px;padding:6px 12px;border-bottom:1px solid var(--line)}
.shortcuts .sc{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;position:relative;transition:transform .15s}
.shortcuts .sc:hover,.shortcuts .sc.active{background:var(--surface2)}
.shortcuts .sc .badge{position:absolute;top:2px;right:2px;min-width:14px;height:14px;border-radius:7px;background:var(--rose);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.shortcuts .more{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:18px;letter-spacing:1px;color:var(--ink2)}
.shortcuts .more:hover{background:var(--surface2)}
.tree{flex:1;overflow:auto;padding:8px 8px 16px}
.folder{margin-bottom:8px}
.folder>.fh{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.folder>.fh:hover{background:var(--surface2)}
.folder>.fh .caret{transition:transform .2s;font-size:10px}
.folder.closed>.fh .caret{transform:rotate(-90deg)}
.folder.closed>.items{display:none}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:8px;cursor:pointer;color:var(--ink);position:relative}
.item:hover{background:var(--surface2)}
.item.active{background:var(--accent-soft);font-weight:800}
.item .ico{width:22px;text-align:center;font-size:15px}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cnt{font-size:11px;color:var(--muted)}
.item .lock{font-size:11px}
.item.hidden-sec{opacity:.45}
.item .grip,.sc .grip{display:none;color:var(--muted);font-size:12px;cursor:grab}
/* modo personalizar */
#app.editing .item .grip,#app.editing .sc .grip{display:inline}
#app.editing .sc .grip{position:absolute;bottom:-3px;right:-2px;font-size:9px}
#app.editing .item,#app.editing .sc{animation:wiggle .35s ease-in-out infinite alternate}
#app.editing .item:nth-child(odd),#app.editing .sc:nth-child(odd){animation-delay:.12s}
@keyframes wiggle{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
@media (prefers-reduced-motion:reduce){#app.editing .item,#app.editing .sc{animation:none;outline:1px dashed var(--accent)}}
.dragover{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.dragging{opacity:.4}
.sidefoot{border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:6px}
.sidefoot button{flex:1;padding:8px;border-radius:9px;background:var(--surface2);font-weight:700;font-size:12px}
.sidefoot button.on{background:var(--accent);color:var(--accent-ink)}

/* ---------- MAIN ---------- */
#main{overflow:auto;padding:22px 28px 60px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.topbar h2{font-size:26px;font-weight:800}
.topbar .nick{font-family:var(--display);font-style:italic;color:var(--muted);font-size:15px}
.topbar .tools{margin-left:auto;display:flex;gap:6px}
.tb{padding:7px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.tb.ai{background:var(--accent-soft);border-color:transparent}
.tb.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .label{margin-left:auto}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--surface2)}
.row .t{flex:1}
.row .t small{display:block;color:var(--muted);font-size:11.5px}
.check{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px}
.row.done .check{background:var(--sage);border-color:var(--sage);color:#fff}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.rose i{background:var(--rose)} .bar.sage i{background:var(--sage)} .bar.sky i{background:var(--sky)}
.stamp{display:inline-block;padding:4px 10px;border:2px solid var(--rose);color:var(--rose);font-family:var(--display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px;transform:rotate(-4deg);border-radius:4px;opacity:.9}
.note{font-size:12px;color:var(--ink2);background:var(--surface2);padding:8px 10px;border-radius:8px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.02em}

/* HOJE countdown */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.countdown{background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:220px}
.countdown .modes{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.countdown .modes button{width:26px;height:26px;border-radius:7px;font-size:12px;background:var(--surface);border:1px solid var(--line)}
.countdown .modes button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.cd-units{display:flex;gap:18px;align-items:baseline}
.cd-units b{font-family:var(--display);font-size:44px;font-weight:800;line-height:1}
.cd-units span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,60%),var(--surface2) 0);display:grid;place-items:center}
.ring i{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;font-style:normal}
.memory{background:var(--rose-soft);border-radius:var(--r);padding:18px;position:relative}
.memory .photo{width:100%;aspect-ratio:16/8;border-radius:10px;background:linear-gradient(135deg,var(--rose),var(--accent));opacity:.55;margin-bottom:10px}
.memory q{font-family:var(--display);font-size:17px;font-style:italic;display:block}

/* Protocolos */
.coupon{border:2px dashed var(--line);border-radius:12px;padding:14px;position:relative;background:var(--surface)}
.coupon.rare{border-color:var(--sky)} .coupon.epic{border-color:var(--rose)} .coupon.legend{border-color:var(--gold);background:linear-gradient(160deg,var(--accent-soft),var(--surface))} .coupon.unique{border-color:var(--ink);border-style:double;border-width:4px}
.coupon .rar{position:absolute;top:-9px;left:12px;background:var(--surface);padding:0 6px}
.coupon h4{font-family:var(--display);font-size:16px;margin:6px 0 4px}
.coupon .uses{display:flex;gap:4px;margin:8px 0}
.coupon .uses i{width:14px;height:14px;border-radius:3px;background:var(--accent)} .coupon .uses i.spent{background:var(--surface2)}
.coupon .use{padding:6px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:800;font-size:12px}
.coupon .use:disabled{opacity:.35;cursor:not-allowed}

/* Contrato */
.contract{background:var(--surface);border:1px solid var(--line);padding:30px 34px;font-family:var(--display);max-width:720px;line-height:1.6;position:relative}
.contract h3{text-align:center;letter-spacing:.1em;text-transform:uppercase;font-size:14px;margin-bottom:16px;display:block}
.contract ol{padding-left:22px}.contract li{margin-bottom:8px}
.contract .sigs{display:flex;gap:30px;margin-top:26px;justify-content:space-between}
.contract .sig{flex:1;border-top:1px solid var(--ink);padding-top:6px;font-size:12px;text-align:center;font-family:var(--body)}
.contract .sig b{display:block;font-family:'Fraunces',cursive;font-style:italic;font-size:22px;font-weight:400;margin-bottom:-6px}
.contract .stamp{position:absolute;right:26px;top:22px}

/* WhatsApp */
.wa{background:var(--surface2);border-radius:var(--r);padding:14px;max-width:640px}
.wa .b{max-width:78%;padding:7px 10px;border-radius:10px;margin:4px 0;font-size:13px;position:relative;background:var(--surface)}
.wa .b.me{margin-left:auto;background:var(--sage-soft)}
.wa .b .tm{font-size:10px;color:var(--muted);text-align:right;margin-top:2px}
.wa .b.hl{outline:2px solid var(--accent)}
.wa .b .mk{position:absolute;top:-10px;right:-6px;font-size:14px}
.wa .day{text-align:center;font-size:11px;color:var(--muted);margin:8px 0}

/* Multiverso */
.tree svg text{font-family:var(--body);font-size:12px;fill:var(--ink)}
.tree svg .nd{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.tree svg .nd.root{fill:var(--accent-soft);stroke:var(--accent)}
.tree svg .ln{stroke:var(--line);stroke-width:2;fill:none}

/* Dicionário */
.verb{padding:10px 0;border-bottom:1px solid var(--line)}
.verb b{font-family:var(--display);font-size:18px}
.verb i{color:var(--muted);font-size:12px;margin-left:6px}
.verb p{margin:4px 0 0}
.verb .ex{color:var(--ink2);font-style:italic;font-size:13px}

/* Placar */
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:11.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:10px}
.bars div{flex:1;background:var(--rose);border-radius:4px 4px 0 0;position:relative;min-height:4px}
.bars div small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.streak{display:flex;gap:4px;flex-wrap:wrap}
.streak i{width:16px;height:16px;border-radius:4px;background:var(--surface2)} .streak i.on{background:var(--rose)}

/* Álbum */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ph{aspect-ratio:1;border-radius:10px;position:relative;overflow:hidden;background:var(--surface2)}
.ph::after{content:attr(data-cap);position:absolute;left:0;right:0;bottom:0;padding:6px;font-size:10.5px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff}
.polaroid .ph{border:8px solid #fff;border-bottom-width:28px;box-shadow:var(--shadow);border-radius:2px;transform:rotate(var(--rot,0deg))}

/* Timeline */
.tl{position:relative;padding-left:26px;border-left:2px solid var(--line);margin-left:8px}
.tl .ev{position:relative;margin-bottom:18px}
.tl .ev::before{content:"";position:absolute;left:-33px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.tl .ev.big::before{background:var(--rose);width:16px;height:16px;left:-35px}
.tl .ev b{font-family:var(--display);font-size:15px}
.tl .ev small{display:block;color:var(--muted)}

/* Matilha */
.pack{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.member{text-align:center;padding:14px 10px}
.member .face{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:26px;background:var(--surface2)}
.member b{display:block}.member small{color:var(--muted);display:block;font-size:11px}

/* ---------- DETAIL ---------- */
#detail{background:var(--surface);border-left:1px solid var(--line);padding:20px;overflow:auto}
#detail .label{margin-bottom:6px}
#detail h3{font-size:18px;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.field{margin-top:14px}
.field textarea,.field input{width:100%;font:inherit;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);resize:vertical}
.attach{display:flex;gap:6px;margin-top:6px}
.attach div{width:54px;height:54px;border-radius:8px;background:linear-gradient(135deg,var(--sky-soft),var(--accent-soft))}
.attach button{width:54px;height:54px;border-radius:8px;border:1px dashed var(--line);font-size:20px;color:var(--muted)}
.cmt{display:flex;gap:8px;margin-top:10px;font-size:12.5px}
.cmt .avatar{flex:none;width:22px;height:22px;font-size:10px}
.cmt small{display:block;color:var(--muted);font-size:10.5px}
.hist{font-size:11px;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:10px}

/* ---------- POPOVER / TOAST ---------- */
.pop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;min-width:230px}
.pop .label{padding:6px 8px 4px}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;font-size:13px}
.pop button:hover{background:var(--surface2)}
.pop .sep{height:1px;background:var(--line);margin:6px 0}
.pop .skins{display:flex;gap:6px;padding:4px 8px}
.pop .skins button{width:auto;padding:0;border-radius:50%;width:22px;height:22px;border:2px solid var(--line)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
.tag-ex{position:fixed;top:8px;right:8px;z-index:9;font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
[contenteditable="true"]{outline:1px dashed var(--accent);padding:0 3px;border-radius:4px}
</style>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div><h1>HyHoney</h1><div class="sub">o app do casal · mockup v0.2</div></div>
      <div class="couple" title="Duas contas, uma casa"><span class="avatar av-a">O</span><span class="avatar av-b">M</span></div>
    </div>
    <div class="shortcuts" id="shortcuts"></div>
    <div class="tree" id="tree"></div>
    <div class="sidefoot">
      <button id="btnEdit" title="Arrastar, renomear, ocultar">✎ Personalizar</button>
      <button id="btnNew">＋ Nova seção</button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar"></nav>

  <aside id="detail">
    <div class="empty">Clique em qualquer item para ver notas, fotos, comentários e quem mexeu.</div>
  </aside>
</div>
<div id="toast"></div>
<div class="tag-ex">dados de exemplo</div>

<script>
/* ==================== DADOS ==================== */
const ME={id:'a',name:'Odin',cls:'av-a',ini:'O'};
const YOU={id:'b',name:'Mel',cls:'av-b',ini:'M'}; // nome de exemplo; editável em ⋯ → Configurações
const START='2021-08-14'; // data de exemplo do início do namoro

const DEFAULT_SECTIONS=[
 // pasta NÓS
 {id:'hoje',ico:'🏠',name:'Hoje',nick:'A Capa',folder:'nos'},
 {id:'saga',ico:'📜',name:'Linha do Tempo',nick:'A Saga',folder:'nos'},
 {id:'almanaque',ico:'📅',name:'Calendário',nick:'O Almanaque',folder:'nos'},
 {id:'museu',ico:'📸',name:'Álbum',nick:'O Museu',folder:'nos'},
 {id:'autos',ico:'💬',name:'Arquivo WhatsApp',nick:'Os Autos',folder:'nos'},
 {id:'correio',ico:'💌',name:'Cartas & Presentes',nick:'O Correio',folder:'nos'},
 // CARTÓRIO
 {id:'contrato',ico:'📜',name:'Termos & Condições',nick:'O Contrato',folder:'cartorio'},
 {id:'protocolos',ico:'🎟️',name:'Protocolos',nick:'Os Cupons',folder:'cartorio',cnt:7},
 {id:'manual',ico:'📘',name:'Manual do Parceiro',nick:'O Manual',folder:'cartorio'},
 {id:'matilha',ico:'🐾',name:'A Matilha',nick:'O Bando',folder:'cartorio'},
 // LABORATÓRIO
 {id:'multiverso',ico:'🗺️',name:'Universos Paralelos',nick:'O Multiverso',folder:'lab'},
 {id:'dicionario',ico:'📖',name:'Dicionário do Casal',nick:'O Dicionário',folder:'lab',cnt:14},
 {id:'louca',ico:'✨',name:'To-do Mágico',nick:'A Lista Louca',folder:'lab',cnt:9},
 {id:'roleta',ico:'🎲',name:'O Que Fazer Hoje?',nick:'A Roleta',folder:'lab'},
 {id:'oficina',ico:'✍️',name:'Histórias a Dois',nick:'A Oficina',folder:'lab'},
 {id:'mapa',ico:'🎯',name:'Metas & Sonhos',nick:'O Mapa',folder:'lab'},
 // PAINEL
 {id:'agenda',ico:'🗓️',name:'Próximos',nick:'A Agenda',folder:'painel',cnt:4},
 {id:'deveres',ico:'🧹',name:'To-do Chato',nick:'Os Deveres',folder:'painel',cnt:5},
 {id:'viagens',ico:'🧳',name:'Viagens',nick:'O Passaporte',folder:'painel'},
 {id:'cinema',ico:'🎬',name:'Cinema',nick:'A Cinemateca',folder:'painel'},
 {id:'placar',ico:'🔥',name:'Registro Íntimo',nick:'O Placar',folder:'painel',pin:true},
 {id:'controle',ico:'📊',name:'Sala de Controle',nick:'As Estatísticas',folder:'painel'},
 {id:'cofre',ico:'🔒',name:'Finanças & Responsabilidades',nick:'O Cofre',folder:'painel',admin:true,hidden:true},
];
const FOLDERS=[{id:'nos',ico:'💗',name:'Nós'},{id:'cartorio',ico:'🏛️',name:'Cartório'},{id:'lab',ico:'🧪',name:'Laboratório'},{id:'painel',ico:'⚙️',name:'Painel'},{id:'custom',ico:'📁',name:'Minhas seções'}];
const DEFAULT_SHORTCUTS=['hoje','agenda','louca','protocolos','viagens'];

let state=load()||{sections:JSON.parse(JSON.stringify(DEFAULT_SECTIONS)),shortcuts:[...DEFAULT_SHORTCUTS],skin:'mel',cdMode:0,closed:{},current:'hoje',protoUsed:{},done:{}};
let editing=false;
// seções novas do padrão entram mesmo em quem já tinha personalização salva
DEFAULT_SECTIONS.forEach((d,i)=>{if(!state.sections.find(s=>s.id===d.id)){const after=DEFAULT_SECTIONS[i-1];const j=after?state.sections.findIndex(s=>s.id===after.id):-1;state.sections.splice(j+1,0,JSON.parse(JSON.stringify(d)))}});
state.roleta=state.roleta||{};

function load(){try{const s=localStorage.getItem('hyhoney');return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem('hyhoney',JSON.stringify(state))}catch(e){}}
const sec=id=>state.sections.find(s=>s.id===id);
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function daysSince(d){return Math.floor((Date.now()-new Date(d+'T00:00:00'))/864e5)}
function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})}
function ago(d){const n=daysSince(d);return n===0?'hoje':n===1?'ontem':`há ${n.toLocaleString('pt-BR')} dias`}

/* ==================== SIDEBAR ==================== */
function renderSidebar(){
  const sc=$('#shortcuts');sc.innerHTML='';
  state.shortcuts.forEach(id=>{const s=sec(id);if(!s)return;
    const b=document.createElement('button');b.className='sc'+(state.current===id?' active':'');b.draggable=true;b.dataset.id=id;b.title=s.name;
    b.innerHTML=`${s.ico}${s.cnt?`<span class="badge">${s.cnt}</span>`:''}<span class="grip">⋮⋮</span>`;
    b.onclick=()=>open(id);drag(b,'sc');sc.appendChild(b)});
  const more=document.createElement('button');more.className='more';more.textContent='⋯';more.title='Mais atalhos e personalização';more.onclick=e=>morePop(e);sc.appendChild(more);

  const tree=$('#tree');tree.innerHTML='';
  FOLDERS.forEach(f=>{const items=state.sections.filter(s=>s.folder===f.id);if(f.id==='custom'&&!items.length&&!editing)return;
    const d=document.createElement('div');d.className='folder'+(state.closed[f.id]?' closed':'');
    d.innerHTML=`<div class="fh"><span class="caret">▼</span>${f.ico} <span>${f.name}</span><span style="margin-left:auto;font-weight:400">${items.length}</span></div><div class="items" data-folder="${f.id}"></div>`;
    d.querySelector('.fh').onclick=()=>{state.closed[f.id]=!state.closed[f.id];save();renderSidebar()};
    const box=d.querySelector('.items');
    box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('dragover')});
    box.addEventListener('dragleave',()=>box.classList.remove('dragover'));
    box.addEventListener('drop',e=>{e.preventDefault();box.classList.remove('dragover');const id=e.dataTransfer.getData('sec');if(!id)return;const s=sec(id);if(s){s.folder=f.id;save();renderSidebar();toast(`"${s.name}" movida para ${f.name}`)}});
    items.forEach(s=>{const it=document.createElement('div');it.className='item'+(state.current===s.id?' active':'')+(s.hidden?' hidden-sec':'');it.draggable=true;it.dataset.id=s.id;
      it.innerHTML=`<span class="grip">⋮⋮</span><span class="ico">${s.ico}</span><span class="nm">${s.name}</span>${s.admin?'<span class="lock" title="Só o admin vê">👑</span>':''}${s.pin?'<span class="lock" title="PIN">🔐</span>':''}${s.hidden?'<span class="lock" title="Oculta para '+YOU.name+'">🙈</span>':''}${s.cnt?`<span class="cnt num">${s.cnt}</span>`:''}`;
      it.onclick=()=>open(s.id);it.oncontextmenu=e=>{e.preventDefault();itemPop(e,s)};
      it.querySelector('.nm').ondblclick=e=>{if(editing){e.stopPropagation();rename(it.querySelector('.nm'),s)}};
      drag(it,'sec');box.appendChild(it)});
    tree.appendChild(d)});
  renderTabbar();
}
function drag(el,kind){
  el.addEventListener('dragstart',e=>{e.dataTransfer.setData(kind,el.dataset.id);e.dataTransfer.setData('text/plain',el.dataset.id);el.classList.add('dragging')});
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  el.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();el.classList.add('dragover')});
  el.addEventListener('dragleave',()=>el.classList.remove('dragover'));
  el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('dragover');
    const from=e.dataTransfer.getData(kind)||e.dataTransfer.getData('text/plain');const to=el.dataset.id;if(!from||from===to)return;
    if(kind==='sc'){const a=state.shortcuts;const i=a.indexOf(from),j=a.indexOf(to);if(i<0)return;a.splice(i,1);a.splice(j,0,from)}
    else{const a=state.sections;const i=a.findIndex(s=>s.id===from),j=a.findIndex(s=>s.id===to);const [m]=a.splice(i,1);m.folder=a[j>i?j-1:j]?.folder||m.folder;a.splice(a.findIndex(s=>s.id===to),0,m)}
    save();renderSidebar();toast('Ordem atualizada')});
}
function rename(el,s){el.contentEditable='true';el.focus();document.execCommand('selectAll',false,null);
  const end=()=>{el.contentEditable='false';s.name=el.textContent.trim()||s.name;save();renderSidebar();if(state.current===s.id)renderMain()};
  el.onblur=end;el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}}}
function closePops(){document.querySelectorAll('.pop').forEach(p=>p.remove())}
function pop(e,html){closePops();const p=document.createElement('div');p.className='pop';p.innerHTML=html;document.body.appendChild(p);
  const r=e.currentTarget.getBoundingClientRect();p.style.left=Math.min(r.left,innerWidth-260)+'px';p.style.top=(r.bottom+6)+'px';
  setTimeout(()=>document.addEventListener('click',closePops,{once:true}),0);p.onclick=ev=>ev.stopPropagation();return p}
function morePop(e){
  const extra=state.sections.filter(s=>!state.shortcuts.includes(s.id)&&!(s.hidden&&!s.admin));
  const p=pop(e,`<div class="label">Mais atalhos</div>${extra.map(s=>`<button data-open="${s.id}"><span>${s.ico}</span>${s.name}<span style="margin-left:auto" class="chip">${s.nick}</span></button>`).join('')}
   <div class="sep"></div><div class="label">Personalizar</div>
   <button data-act="edit">✎ Arrastar e renomear</button><button data-act="new">＋ Criar seção nova</button>
   <button data-act="shortcuts">⭐ Escolher atalhos fixos</button>
   <div class="sep"></div><div class="label">Tema (pele)</div>
   <div class="skins">${[['mel','#E8A33D','Mel & Papel'],['cartorio','#1B1A1F','Cartório Noturno'],['polaroid','#ffffff','Polaroid'],['arcade','#FF3FA4','Neon Arcade'],['passaporte','#1F6F5B','Passaporte']].map(([k,c,n])=>`<button data-skin="${k}" title="${n}" style="background:${c}"></button>`).join('')}</div>
   <div class="sep"></div><button data-act="export">⬇ Exportar configuração</button><button data-act="reset">↺ Restaurar padrão</button>`);
  p.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{open(b.dataset.open);closePops()});
  p.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{state.skin=b.dataset.skin;applySkin();save();toast('Tema: '+b.title)});
  p.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;closePops();
    if(a==='edit')toggleEdit();if(a==='new')newSection();if(a==='export')exportCfg();if(a==='shortcuts')toast('Arraste uma seção da lista até a barra de atalhos (ou use o botão direito → Fixar)');
    if(a==='reset'){try{localStorage.removeItem('hyhoney')}catch(_){}location.reload()}});
}
function itemPop(e,s){const p=pop(e,`<div class="label">${s.ico} ${s.name}</div>
  <button data-a="pin">${state.shortcuts.includes(s.id)?'⭐ Tirar dos atalhos':'⭐ Fixar nos atalhos'}</button>
  <button data-a="rename">✎ Renomear</button><button data-a="emoji">🎲 Trocar ícone</button>
  <button data-a="hide">${s.hidden?'👁 Mostrar para '+YOU.name:'🙈 Ocultar de '+YOU.name}</button>
  ${s.folder==='custom'?'<button data-a="del">🗑 Apagar</button>':''}`);
  p.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a;closePops();
    if(a==='pin'){const i=state.shortcuts.indexOf(s.id);i<0?state.shortcuts.push(s.id):state.shortcuts.splice(i,1)}
    if(a==='hide'){s.hidden=!s.hidden;toast(s.hidden?`Só você vê "${s.name}" agora`:`"${s.name}" liberada para ${YOU.name}`)}
    if(a==='emoji'){const E=['💛','🍯','🐝','🌙','🎈','🍕','🎲','🦆','🧸','🌵'];s.ico=E[Math.floor(Math.random()*E.length)]}
    if(a==='del'){state.sections=state.sections.filter(x=>x.id!==s.id);state.shortcuts=state.shortcuts.filter(x=>x!==s.id);if(state.current===s.id)state.current='hoje'}
    if(a==='rename'){if(!editing)toggleEdit();setTimeout(()=>{const el=document.querySelector(`.item[data-id="${s.id}"] .nm`);if(el)rename(el,s)},50);return}
    save();renderSidebar();renderMain()})}
function toggleEdit(){editing=!editing;$('#app').classList.toggle('editing',editing);$('#btnEdit').classList.toggle('on',editing);toast(editing?'Modo personalizar: arraste, clique 2× para renomear, botão direito para mais':'Personalização salva');renderSidebar()}
const MOLDES=[['lista','📋','Lista'],['galeria','🖼️','Galeria'],['calendario','📅','Calendário'],['dicionario','📖','Dicionário'],['arvore','🌳','Árvore'],['placar','🏆','Placar']];
function newSection(){const id='c'+Date.now();const m=MOLDES[Math.floor(Math.random()*MOLDES.length)];
  state.sections.push({id,ico:m[1],name:'Nova seção ('+m[2]+')',nick:'molde: '+m[2],folder:'custom',molde:m[0]});save();
  if(!editing)toggleEdit();renderSidebar();open(id);setTimeout(()=>{const el=document.querySelector(`.item[data-id="${id}"] .nm`);if(el)rename(el,sec(id))},60)}
function exportCfg(){const cfg=JSON.stringify({shortcuts:state.shortcuts,skin:state.skin,sections:state.sections.map(s=>({id:s.id,name:s.name,ico:s.ico,folder:s.folder,hidden:!!s.hidden}))},null,1);
  navigator.clipboard?.writeText(cfg).then(()=>toast('Configuração copiada — cole no chat com o Claude'),()=>toast('Não consegui copiar; veja o console'));console.log(cfg)}
function applySkin(){$('#app').dataset.skin=state.skin;document.body.classList.toggle('polaroid',state.skin==='polaroid')}

/* ==================== MAIN ==================== */
function open(id){state.current=id;save();$('#app').classList.remove('drawer','sheet');renderSidebar();renderMain();$('#main').scrollTop=0;window.scrollTo(0,0)}
/* barra inferior mobile: os 4 primeiros atalhos + ⋯ (mesma lista arrastável da sidebar) */
function renderTabbar(){const tb=$('#tabbar');tb.innerHTML='';
  state.shortcuts.slice(0,4).forEach(id=>{const s=sec(id);if(!s)return;const b=document.createElement('button');b.className=state.current===id?'active':'';b.draggable=true;b.dataset.id=id;
    b.innerHTML=`<span class="i">${s.ico}</span>${s.name.split(' ')[0]}${s.cnt?`<span class="badge">${s.cnt}</span>`:''}`;b.onclick=()=>open(id);drag(b,'sc');tb.appendChild(b)});
  const more=document.createElement('button');more.innerHTML='<span class="i">⋯</span>Mais';more.onclick=e=>morePop(e);tb.appendChild(more)}
function renderMain(){const s=sec(state.current)||sec('hoje');const m=$('#main');
  const v=VIEWS[s.id]||generic;
  m.innerHTML=`<div class="mob-top"><button class="ham" id="ham" title="Listas">☰</button><b style="font-family:var(--display);font-size:18px">HyHoney</b><div class="couple"><span class="avatar av-a">O</span><span class="avatar av-b">M</span></div></div><div class="topbar"><span style="font-size:26px">${s.ico}</span><h2>${s.name}</h2><span class="nick">${s.nick||''}</span>
   <div class="tools">${s.admin?'<span class="chip gold">👑 só admin</span>':''}${s.hidden?'<span class="chip">🙈 oculta para '+YOU.name+'</span>':''}<button class="tb ai" data-ai>✨ IA</button><button class="tb">⚙︎ Visualização</button><button class="tb primary">＋ Adicionar</button></div></div>${v(s)}`;
  m.querySelector('[data-ai]').onclick=e=>aiPop(e,s);
  m.querySelector('#ham').onclick=()=>$('#app').classList.add('drawer');
  renderTabbar();
  m.querySelectorAll('[data-detail]').forEach(el=>el.addEventListener('click',()=>detail(JSON.parse(el.dataset.detail))));
  m.querySelectorAll('.row .check').forEach(c=>c.addEventListener('click',e=>{e.stopPropagation();const r=c.closest('.row');r.classList.toggle('done');state.done[r.dataset.k]=r.classList.contains('done');save();if(r.classList.contains('done'))toast('Feito! +1 no placar de '+ME.name)}));
  m.querySelectorAll('.cd-mode').forEach(b=>b.onclick=()=>{state.cdMode=+b.dataset.m;save();renderMain()});
  m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const g=b.dataset.f,v=b.dataset.v;state.roleta[g]=state.roleta[g]===v?undefined:v;delete state.roleta.pick;save();renderMain()});
  const so=m.querySelector('[data-sortear]');if(so)so.onclick=()=>{const f=state.roleta;const l=ROLES.map((r,i)=>[r,i]).filter(([r])=>(!f.k||r.k===f.k)&&(!f.e||r.e===+f.e)&&(!f.m||r.m===+f.m)&&(!f.h||r.h===f.h));if(!l.length){toast('Nada combina — afrouxe um filtro');return}state.roleta.pick=l[Math.floor(Math.random()*l.length)][1];save();renderMain();toast('🎲 Saiu na roleta!')};
  const lp=m.querySelector('[data-limpar]');if(lp)lp.onclick=()=>{state.roleta={};save();renderMain()};
  const ar=m.querySelector('[data-ai-roleta]');if(ar)ar.onclick=e=>{const p=pop(e,`<div class="label">IA · A Roleta</div><button>✨ Inventar 3 rolês com estes filtros</button><button>✨ Sugerir pelo Manual do Parceiro</button><button>✨ Criar template a partir do que mais repetimos</button><button>✨ Rolê surpresa (só revela na hora)</button><div class="sep"></div><div class="note">A IA só propõe; vocês aprovam antes de entrar no catálogo.</div>`);p.querySelectorAll('button').forEach(b=>b.onclick=()=>{closePops();toast('IA: proposta pronta para revisar (mockup)')})};
  m.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const k=b.dataset.use;state.protoUsed[k]=(state.protoUsed[k]||0)+1;save();renderMain();toast('Protocolo usado e registrado. Adicione nota e foto →');detail({t:PROTOS.find(p=>p.k===k).t,sub:'Uso registrado agora por '+ME.name,by:ME,when:'agora',kind:'Protocolo'})});
}
function aiPop(e,s){const acts={dicionario:['Completar verbete','Padronizar todos','Sugerir origem falsa'],multiverso:['Gerar cenário aleatório','Ramificar este nó','Escrever manchete'],contrato:['Formalizar cláusula','Sugerir aditivo','Detectar brechas cômicas'],hoje:['Frase do dia','Resumo do mês','Ideia de encontro (usa o Manual)'],cinema:['Recomendar próximo filme','Resumir sem spoiler']}[s.id]||['Sugerir ideias para esta seção','Resumir','Legendar em tom de museu'];
  const p=pop(e,`<div class="label">IA · ${s.name}</div>${acts.map(a=>`<button>✨ ${a}</button>`).join('')}<div class="sep"></div><div class="note">A IA só propõe. Nada é gravado sem você revisar.</div>`);
  p.querySelectorAll('button').forEach(b=>b.onclick=()=>{closePops();toast('IA: "'+b.textContent.slice(2)+'" — proposta pronta para revisar (mockup)')})}

/* --- helpers de item --- */

function autos(){return `<div class="grid" style="grid-template-columns:1fr 300px"><div><div style="display:flex;gap:8px;margin-bottom:10px"><button class="tb primary">Original (só leitura)</button><button class="tb">Camada de edição</button><span class="chip" style="align-self:center">importado em ${fmt('2026-08-30')} · 48.211 mensagens</span></div>
